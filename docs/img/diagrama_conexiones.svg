<svg width="680" height="500" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Esquematico fisico de conexiones - Ruleta de Precision</title>
<desc>Placa STM32F407 con pines PD0 a PD7 conectados por un bus de 8 cables a las columnas C1 a C8 de una matriz LED, cuya fila R8 pasa por una resistencia hacia GND. El boton K-UP en la placa esta enlazado internamente a PA0 configurado con pull-down.</desc>
<rect x="0" y="0" width="680" height="500" fill="#ffffff"/>

<rect x="40" y="60" width="240" height="300" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="160" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#042C53">STM32F407VET6</text>

<rect x="275" y="113" width="10" height="10" fill="#333333"/>
<text x="268" y="121" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#222222">PD0</text>
<rect x="275" y="139" width="10" height="10" fill="#333333"/>
<text x="268" y="147" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#222222">PD1</text>
<rect x="275" y="165" width="10" height="10" fill="#333333"/>
<text x="268" y="173" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#222222">PD2</text>
<rect x="275" y="191" width="10" height="10" fill="#333333"/>
<text x="268" y="199" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#222222">PD3</text>
<rect x="275" y="217" width="10" height="10" fill="#333333"/>
<text x="268" y="225" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#222222">PD4</text>
<rect x="275" y="243" width="10" height="10" fill="#333333"/>
<text x="268" y="251" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#222222">PD5</text>
<rect x="275" y="269" width="10" height="10" fill="#333333"/>
<text x="268" y="277" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#222222">PD6</text>
<rect x="275" y="295" width="10" height="10" fill="#333333"/>
<text x="268" y="303" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#222222">PD7</text>

<circle cx="160" cy="326" r="10" fill="#185FA5" fill-opacity="0.15" stroke="#185FA5" stroke-width="1"/>
<text x="160" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#222222">K-UP -&gt; PA0 (pull-down)</text>

<rect x="430" y="60" width="190" height="300" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="525" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#04342C">Matriz LED 8x8</text>
<text x="525" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">(solo fila R8 usada)</text>

<rect x="420" y="113" width="10" height="10" fill="#333333"/>
<text x="436" y="121" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#222222">C1</text>
<rect x="420" y="139" width="10" height="10" fill="#333333"/>
<text x="436" y="147" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#222222">C2</text>
<rect x="420" y="165" width="10" height="10" fill="#333333"/>
<text x="436" y="173" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#222222">C3</text>
<rect x="420" y="191" width="10" height="10" fill="#333333"/>
<text x="436" y="199" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#222222">C4</text>
<rect x="420" y="217" width="10" height="10" fill="#333333"/>
<text x="436" y="225" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#222222">C5</text>
<rect x="420" y="243" width="10" height="10" fill="#333333"/>
<text x="436" y="251" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#222222">C6</text>
<rect x="420" y="269" width="10" height="10" fill="#333333"/>
<text x="436" y="277" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#222222">C7</text>
<rect x="420" y="295" width="10" height="10" fill="#333333"/>
<text x="436" y="303" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#222222">C8</text>

<rect x="520" y="321" width="10" height="10" fill="#333333"/>
<text x="536" y="329" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#222222">Fila R8</text>

<line x1="285" y1="118" x2="420" y2="118" stroke="#555555" stroke-width="1"/>
<line x1="285" y1="144" x2="420" y2="144" stroke="#555555" stroke-width="1"/>
<line x1="285" y1="170" x2="420" y2="170" stroke="#555555" stroke-width="1"/>
<line x1="285" y1="196" x2="420" y2="196" stroke="#555555" stroke-width="1"/>
<line x1="285" y1="222" x2="420" y2="222" stroke="#555555" stroke-width="1"/>
<line x1="285" y1="248" x2="420" y2="248" stroke="#555555" stroke-width="1"/>
<line x1="285" y1="274" x2="420" y2="274" stroke="#555555" stroke-width="1"/>
<line x1="285" y1="300" x2="420" y2="300" stroke="#555555" stroke-width="1"/>
<text x="352" y="109" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#222222">PD0-PD7 -&gt; C1-C8</text>

<line x1="525" y1="331" x2="525" y2="400" stroke="#555555" stroke-width="0.75"/>
<path d="M525,400 L515,408 L535,416 L515,424 L535,432 L525,440" fill="none" stroke="#555555" stroke-width="1"/>
<line x1="525" y1="440" x2="525" y2="460" stroke="#555555" stroke-width="0.75"/>
<line x1="505" y1="460" x2="545" y2="460" stroke="#555555" stroke-width="1"/>
<line x1="511" y1="466" x2="539" y2="466" stroke="#555555" stroke-width="1"/>
<line x1="517" y1="472" x2="533" y2="472" stroke="#555555" stroke-width="1"/>
<text x="548" y="419" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#222222">Resistencia</text>
<text x="548" y="469" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#222222">GND</text>
</svg>
